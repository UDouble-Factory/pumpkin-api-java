name: Main

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_run:
    types: [completed]
    workflows: [Update WIT]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: actions/cache@v6
        with:
          path: |
            api/tools
            ~/.gradle/caches/pumpkin-java/tools
          key: ${{ runner.os }}-${{ runner.arch }}-pumpkin-java-${{ hashFiles('gradle/tool-versions.properties') }}
      - name: Select isolated Maven repository
        run: echo "PUMPKIN_CI_REPOSITORY=$RUNNER_TEMP/pumpkin-maven" >> "$GITHUB_ENV"
      - name: Build, test and publish development packages
        run: ./gradlew build :api:publishToMavenLocal :gradle-plugin:publishToMavenLocal -Dmaven.repo.local="$PUMPKIN_CI_REPOSITORY" --no-daemon
      - name: Prepare template verification project
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          destination = Path("build/template-check")
          shutil.copytree("example", destination, ignore=shutil.ignore_patterns("build", ".gradle", ".idea"))
          repository = Path(os.environ["PUMPKIN_CI_REPOSITORY"]).resolve().as_uri()

          for name in ("settings.gradle.kts", "build.gradle.kts", "gradle.properties"):
              path = destination / name
              contents = path.read_text(encoding="utf-8")
              contents = contents.replace("<jitpack-version>", "0.1.1")
              contents = contents.replace("com.github.UDouble-Factory.pumpkin-api-java", "io.github.udouble-factory")
              contents = contents.replace("https://jitpack.io", repository)
              path.write_text(contents, encoding="utf-8")
          PY
      - name: Build template verification project
        run: ./gradlew -p build/template-check build --no-daemon
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: java-distributions-${{ runner.os }}
          path: |
            api/build/libs/*.jar
            gradle-plugin/build/libs/*.jar
            build/template-check/build/pumpkin-example.wasm

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: java-distributions-Linux
          path: artifacts
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'CI' }}
          artifacts: artifacts/**/*.jar,artifacts/**/*.wasm
          allowUpdates: true
          omitName: true
          omitBody: true
          omitDraftDuringUpdate: true
          removeArtifacts: true
